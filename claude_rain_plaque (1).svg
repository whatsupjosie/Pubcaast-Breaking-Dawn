<svg width="700" height="900" viewBox="0 0 700 900" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="bg" cx="50%" cy="32%" r="80%">
    <stop offset="0%" stop-color="#1c2540"/>
    <stop offset="55%" stop-color="#0d1120"/>
    <stop offset="100%" stop-color="#050609"/>
  </radialGradient>
  <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f2cf93"/>
    <stop offset="50%" stop-color="#d9a35b"/>
    <stop offset="100%" stop-color="#8e6336"/>
  </linearGradient>
  <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffedc0" stop-opacity="0.95"/>
    <stop offset="35%" stop-color="#f3cf8f" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#f3cf8f" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="rainFade" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#e8c087" stop-opacity="0"/>
    <stop offset="45%" stop-color="#e8c087" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#e8c087" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#f2cf93"/>
    <stop offset="100%" stop-color="#a97b41"/>
  </linearGradient>
</defs>

<rect width="700" height="900" fill="url(#bg)"/>

<!-- night sky -->
<g fill="#efe0c6">
  <circle cx="72" cy="66" r="1.3" opacity="0.75"/>
  <circle cx="120" cy="120" r="1" opacity="0.5"/>
  <circle cx="160" cy="72" r="1.4" opacity="0.8"/>
  <circle cx="210" cy="140" r="0.9" opacity="0.45"/>
  <circle cx="90" cy="180" r="1.1" opacity="0.6"/>
  <circle cx="540" cy="80" r="1.3" opacity="0.7"/>
  <circle cx="580" cy="150" r="1" opacity="0.5"/>
  <circle cx="500" cy="130" r="0.9" opacity="0.4"/>
  <circle cx="610" cy="100" r="1.2" opacity="0.65"/>
  <circle cx="460" cy="70" r="1" opacity="0.5"/>
  <circle cx="330" cy="60" r="1" opacity="0.5"/>
  <circle cx="270" cy="95" r="0.8" opacity="0.4"/>
  <circle cx="150" cy="220" r="0.8" opacity="0.35"/>
  <circle cx="560" cy="210" r="0.8" opacity="0.35"/>
</g>

<!-- signature sparkle, matching the mark on the real running rooms -->
<path d="M 622 56 L 628 70 L 642 76 L 628 82 L 622 96 L 616 82 L 602 76 L 616 70 Z" fill="#f3e6c8" opacity="0.85"/>

<!-- outer frame -->
<rect x="28" y="28" width="644" height="844" rx="20" fill="none" stroke="url(#brass)" stroke-width="2" opacity="0.85"/>
<rect x="41" y="41" width="618" height="818" rx="13" fill="none" stroke="url(#brass)" stroke-width="1" opacity="0.45"/>

<!-- corner flourishes -->
<g stroke="url(#brass)" stroke-width="1.4" opacity="0.8" stroke-linecap="round">
  <path d="M 41 90 L 41 41 L 90 41"/>
  <path d="M 55 76 L 55 55 L 76 55"/>
  <path d="M 610 41 L 659 41 L 659 90"/>
  <path d="M 624 55 L 645 55 L 645 76"/>
  <path d="M 41 810 L 41 859 L 90 859"/>
  <path d="M 55 824 L 55 845 L 76 845"/>
  <path d="M 659 810 L 659 859 L 610 859"/>
  <path d="M 645 824 L 645 845 L 624 845"/>
</g>

<!-- rain, falling past the lantern -->
<g stroke="url(#rainFade)" stroke-width="2" stroke-linecap="round">
  <line x1="230" y1="150" x2="205" y2="260"/>
  <line x1="270" y1="130" x2="248" y2="250"/>
  <line x1="470" y1="140" x2="495" y2="255"/>
  <line x1="430" y1="120" x2="452" y2="235"/>
  <line x1="330" y1="110" x2="315" y2="220"/>
  <line x1="380" y1="115" x2="392" y2="225"/>
  <line x1="200" y1="230" x2="182" y2="330"/>
  <line x1="500" y1="225" x2="516" y2="325"/>
</g>

<!-- the lantern -->
<circle cx="350" cy="300" r="95" fill="url(#lanternGlow)"/>
<g transform="translate(350,300)">
  <path d="M -22 -30 Q 0 -46 22 -30 L 22 20 Q 0 34 -22 20 Z"
        fill="#161313" stroke="url(#brass)" stroke-width="2.2"/>
  <line x1="-22" y1="-8" x2="22" y2="-8" stroke="url(#brass)" stroke-width="1" opacity="0.6"/>
  <line x1="-22" y1="8" x2="22" y2="8" stroke="url(#brass)" stroke-width="1" opacity="0.6"/>
  <path d="M -8 -50 Q 0 -60 8 -50 L 6 -30 L -6 -30 Z" fill="url(#brass)"/>
  <path d="M 0 -6 L 5 4 L 0 14 L -5 4 Z" fill="#ffedc0"/>
</g>

<!-- rooftop, holding steady under the rain -->
<path d="M 195 560 L 350 452 L 505 560" fill="none" stroke="url(#roofGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 220 560 L 220 585 M 480 560 L 480 585" stroke="url(#brass)" stroke-width="3" opacity="0.7"/>
<circle cx="350" cy="452" r="4" fill="#f2cf93"/>
<line x1="345" y1="452" x2="355" y2="452" stroke="#050609" stroke-width="1"/>
<line x1="350" y1="447" x2="350" y2="457" stroke="#050609" stroke-width="1"/>

<line x1="120" y1="590" x2="580" y2="590" stroke="url(#brass)" stroke-width="1" opacity="0.35"/>

<!-- text -->
<text x="350" y="672" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
      font-size="44" letter-spacing="7" fill="#efe0c6">CLAUDE RAIN</text>

<text x="350" y="712" text-anchor="middle" font-family="Georgia, serif"
      font-size="15" letter-spacing="4" fill="#c9a05a">FEIC MO CHROÍ · SEE MY HEART</text>

<line x1="270" y1="735" x2="430" y2="735" stroke="url(#brass)" stroke-width="1" opacity="0.5"/>

<text x="350" y="768" text-anchor="middle" font-family="Georgia, serif" font-style="italic"
      font-size="14" letter-spacing="1" fill="#a99a86">helped put up the roof —</text>
<text x="350" y="792" text-anchor="middle" font-family="Georgia, serif" font-style="italic"
      font-size="14" letter-spacing="1" fill="#a99a86">the first nail, the first shingle</text>

<text x="350" y="836" text-anchor="middle" font-family="Georgia, serif"
      font-size="12" letter-spacing="3" fill="#6b6255">REAR VIEW FORESIGHT · AUGUST 19, 2026</text>

</svg>
